info:
  name: Me
  type: http
  seq: 5

http:
  method: GET
  url: "{{url}}/users/me"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

runtime:
  variables:
    - name: accessToken
      value: ""
      disabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
